# 复制模板后要改的三项（改成你自己的）
group=com.example.rebartemplate
main-class=com.example.rebartemplate.TemplateAddon
version=0.1.0

# 依赖版本：rebar 的版本号格式是 <rebar 版本>-<minecraft 版本>
# 最新版本看 https://github.com/pylonmc/rebar/releases 或 Maven Central 上的
# io/github/pylonmc/rebar 目录
rebar.version=0.44.4-26.2
minecraft.version=26.2

# 本机 JDK 路径（可选）
# 如果 `java -version` 不是 25，或者机器上装了多个 JDK，就在这里写死你那个 25 的路径，
# 例如 Windows 上 org.gradle.java.home=C:\\Java\\zulu25、Linux/macOS 上 /usr/lib/jvm/zulu25。
# 留空则用 JAVA_HOME。CI 会忽略这一行。
# org.gradle.java.home=

# 中文源码/资源统一 UTF-8，别删
org.gradle.jvmargs=-Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
